<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harbor · UMass Boston AI Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--teal:#00E5C7;--deep:#000d1a;--gold:#f5a623;--white:#eef3f8;--glass:rgba(0,16,32,0.85);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(180deg,#02101e,#000a14);height:100vh;display:flex;flex-direction:column;font-family:'Space Grotesk',sans-serif;color:var(--white);overflow:hidden;}
header{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(0,229,199,0.16);}
.avatar{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1c6ea4,#00E5C7);display:flex;align-items:center;justify-content:center;font-size:18px;}
header h1{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;}
header .sub{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:rgba(238,243,248,0.5);text-transform:uppercase;}
.online{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--teal);}
.online::before{content:'●';margin-right:7px;animation:pulse 2.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
#msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:82%;padding:12px 16px;font-size:14px;line-height:1.6;border-radius:10px;}
.msg.bot{background:rgba(0,229,199,0.08);border:1px solid rgba(0,229,199,0.14);align-self:flex-start;}
.msg.user{background:rgba(28,110,164,0.25);border:1px solid rgba(52,144,206,0.3);align-self:flex-end;}
.msg a{color:var(--teal);}
.chips{display:flex;gap:8px;padding:0 20px 12px;flex-wrap:wrap;}
.chip{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:rgba(238,243,248,0.6);background:transparent;border:1px solid rgba(0,229,199,0.25);border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .3s;}
.chip:hover{color:var(--teal);border-color:var(--teal);}
form{display:flex;border-top:1px solid rgba(0,229,199,0.16);}
input{flex:1;padding:16px 20px;background:transparent;border:none;outline:none;color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:15px;}
input::placeholder{color:rgba(238,243,248,0.35);}
button[type=submit]{padding:0 28px;background:var(--teal);color:#00241F;border:none;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .3s;}
button[type=submit]:hover{background:#fff;}
.typing{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:rgba(238,243,248,0.4);padding:0 20px 10px;display:none;}
</style>
</head>
<body>
<header>
  <div class="avatar">⚓</div>
  <div>
    <h1>Harbor</h1>
    <div class="sub">UMass Boston AI Guide · Powered by Claude</div>
  </div>
  <div class="online">Online</div>
</header>
<div id="msgs">
  <div class="msg bot">Welcome aboard! I'm <strong>Harbor</strong> — ask me anything about UMass Boston: programs, admissions, campus life, where to eat at midnight. ⚓</div>
</div>
<div class="typing" id="typing">HARBOR IS TYPING…</div>
<div class="chips">
  <button class="chip" data-q="How do I apply?">How do I apply?</button>
  <button class="chip" data-q="Tell me about the computer science program">CS program</button>
  <button class="chip" data-q="What's campus life like?">Campus life</button>
  <button class="chip" data-q="Tuition and financial aid">Financial aid</button>
</div>
<form id="f">
  <input id="in" autocomplete="off" placeholder="Ask me anything about UMass Boston…">
  <button type="submit">Send</button>
</form>
<script>
(function(){
  var msgs = document.getElementById('msgs');
  var input = document.getElementById('in');
  var typing = document.getElementById('typing');
  var sessionId = 'crossing-' + Math.random().toString(36).slice(2, 10);
  var history = [];
  var busy = false;

  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function add(cls, html){
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.innerHTML = html;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  function send(text){
    if (!text || busy) return;
    busy = true;
    add('user', esc(text));
    history.push({ role: 'user', content: text });
    input.value = '';
    typing.style.display = 'block';
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sessionId, message: text, history: history.slice(0, -1) }),
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      typing.style.display = 'none';
      busy = false;
      // Harbor replies with light HTML formatting (from our own API)
      var reply = d.reply || "I'm resting in the harbor right now — try me on the main site!";
      add('bot', reply);
      history.push({ role: 'assistant', content: reply });
    })
    .catch(function(){
      typing.style.display = 'none';
      busy = false;
      add('bot', 'The tide cut our connection — try again in a moment.');
    });
  }
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    send(input.value.trim());
  });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ send(c.dataset.q); });
  });
})();
</script>
</body>
</html>
